<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>openHAB DSL graph</title>
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.77.0/dist/3d-force-graph.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2330;
      --text: #e7eef7;
      --muted: #8aa0b8;
      --accent: #3d8bfd;
      --border: #2a3848;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 14px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px;
      padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
      z-index: 6;
    }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
    }
    h1 { font-size: 16px; margin: 0; font-weight: 600; }
    .meta { color: var(--muted); font-size: 12px; }
    #deviation {
      font-size: 12px; color: var(--muted); max-width: 1100px;
      border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px 8px;
      background: #141c26;
    }
    #deviation[hidden] { display: none; }
    #deviation > summary {
      cursor: pointer; color: var(--text); font-size: 12px; font-weight: 600;
      list-style: none;
    }
    #deviation > summary::-webkit-details-marker { display: none; }
    #deviation > summary::before { content: "▸ "; }
    #deviation[open] > summary::before { content: "▾ "; }
    #deviation table { border-collapse: collapse; margin-top: 6px; }
    #deviation th, #deviation td { text-align: left; padding: 2px 10px 2px 0; vertical-align: top; }
    #deviation td.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 14px; }
    #deviation .cause { margin: 6px 0 0; }
    #deviation .diff-nodes { display: inline; }
    #deviation .diff-nodes > summary {
      display: inline; cursor: pointer; color: var(--accent); font-weight: 700;
      list-style: none; padding: 0 4px; user-select: none;
    }
    #deviation .diff-nodes > summary::-webkit-details-marker { display: none; }
    #deviation .diff-panel {
      display: flex; flex-wrap: wrap; gap: 16px 28px; margin: 6px 0 8px;
      color: var(--text); font-weight: 400;
    }
    #deviation .diff-h { color: var(--muted); font-weight: 600; margin-bottom: 2px; }
    #deviation .diff-nodes ul {
      margin: 0; padding-left: 16px; max-height: 220px; overflow: auto;
    }
    #deviation .diff-empty { margin: 0; color: var(--muted); }
    fieldset.source-group {
      flex-direction: column; align-items: stretch; gap: 4px;
    }
    fieldset.source-group button { font-weight: 600; }
    fieldset.source-group .token-row {
      display: flex; gap: 4px; align-items: center;
    }
    fieldset.source-group .token-row input {
      min-width: 140px; flex: 1; font-size: 12px;
    }
    button, select, input {
      background: #243044; color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 10px;
    }
    button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    fieldset.engine-group {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      margin: 0; padding: 6px 10px 8px; border: 1px solid var(--border); border-radius: 8px;
      min-width: 0;
    }
    fieldset.engine-group legend {
      padding: 0 6px; color: var(--muted); font-size: 11px; letter-spacing: 0.02em;
    }
    .checks { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
    .checks label { color: var(--muted); display: flex; gap: 5px; align-items: center; }
    .kind-icon { width: 12px; height: 12px; flex-shrink: 0; display: block; }
    #stage {
      position: relative; flex: 1 1 auto; min-height: 0; width: 100%;
      perspective: 1100px; overflow: hidden; background: #0b1016;
    }
    #graph-spin {
      height: 100%; width: 100%; transform-style: preserve-3d;
      transform-origin: 50% 50%;
    }
    #graph { height: 100%; width: 100%; transform-style: preserve-3d; }
    #stage.rotate-mode { cursor: grab; }
    #stage.rotate-mode.rotating { cursor: grabbing; }
    #rotate-banner {
      display: none; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 6; background: #3d8bfd; color: #fff; border-radius: 8px;
      padding: 6px 12px; font-size: 13px; font-weight: 600; pointer-events: none;
    }
    #stage.rotate-mode #rotate-banner { display: block; }
    #hint {
      position: absolute; right: 12px; bottom: 12px; max-width: 360px;
      background: #1a2330ee; border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; font-size: 12px; color: var(--muted); pointer-events: none;
    }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    #detail {
      display: none; position: absolute; top: 12px; right: 12px; z-index: 7;
      width: min(360px, calc(100% - 24px)); max-height: calc(100% - 160px); overflow: auto;
      background: #1a2330f2; border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 14px 14px; color: var(--text); pointer-events: auto;
    }
    #detail.open { display: block; }
    #detail h2 { margin: 0 28px 8px 0; font-size: 15px; font-weight: 600; word-break: break-word; }
    #detail-close {
      position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; padding: 0;
      line-height: 26px; font-size: 18px;
    }
    #detail dl { margin: 0; }
    #detail dt { color: var(--muted); font-size: 11px; margin-top: 8px; }
    #detail dd { margin: 2px 0 0; font-size: 13px; word-break: break-word; }
    #detail ul { margin: 4px 0 0; padding-left: 18px; font-size: 12px; }
    #nav-sphere {
      position: absolute; left: 16px; bottom: 16px; width: 112px; height: 112px;
      z-index: 5; user-select: none; touch-action: none;
    }
    #nav-sphere .ring {
      position: absolute; inset: 0; border-radius: 50%;
      background:
        radial-gradient(circle at 32% 28%, #8ab0d4 0%, #3d556e 38%, #1a2736 72%, #070b10 100%);
      box-shadow: inset 0 2px 6px #ffffff44, inset 0 -8px 16px #00000088, 0 8px 18px #00000088;
      border: 1px solid #3a4c60;
    }
    #nav-sphere .globe {
      position: absolute; inset: 8px; border-radius: 50%;
      transform-style: preserve-3d; transform-origin: 50% 50%;
      background:
        repeating-linear-gradient(0deg, transparent 0 13px, #ffffff14 14px),
        repeating-linear-gradient(90deg, transparent 0 13px, #ffffff10 14px),
        radial-gradient(circle at 30% 28%, #9ec2e4aa 0%, #2c4258cc 55%, #0d141ccc 100%);
      box-shadow: inset -10px -12px 18px #00000099, inset 8px 6px 12px #ffffff22;
      pointer-events: none;
    }
    #nav-sphere .knob {
      position: absolute; left: 50%; top: 50%; width: 44px; height: 44px;
      margin: -22px 0 0 -22px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #d7e6f7 0%, #7ea4c9 38%, #3d5a78 78%, #1a2a3a 100%);
      box-shadow: 0 4px 10px #00000099, inset 0 2px 4px #ffffff66;
      cursor: grab;
    }
    #nav-sphere.dragging .knob { cursor: grabbing; }
    #nav-sphere .zoom {
      position: absolute; width: 26px; height: 26px; border-radius: 50%;
      background: #243044; border: 1px solid #3a4c60; color: var(--text);
      font-size: 16px; line-height: 24px; text-align: center; padding: 0; cursor: pointer;
    }
    #nav-sphere .zoom.in { right: -6px; top: 8px; }
    #nav-sphere .zoom.out { right: -6px; bottom: 8px; }
    #nav-sphere .zoom.fit { left: 50%; bottom: -8px; margin-left: -13px; font-size: 12px; }
    #build-progress {
      position: absolute; top: 0; left: 0; right: 0; z-index: 8;
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; background: #1a2330ee; border-bottom: 1px solid var(--border);
      pointer-events: none; color: var(--text); font-size: 12px; font-weight: 600;
    }
    #build-progress[hidden] { display: none; }
    #build-progress .build-progress-track {
      flex: 1; height: 8px; border-radius: 99px; background: #243044; overflow: hidden;
    }
    #build-progress-fill {
      height: 100%; width: 0%; background: var(--accent); border-radius: 99px;
      transition: width 0.12s linear;
    }
    #build-progress-label { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <div class="toolbar">
      <h1>openHAB DSL graph</h1>
      <fieldset class="engine-group source-group">
        <legend>data source</legend>
        <button id="btn-source-rest" class="active" type="button" title="Load items, things, rules, sitemaps from the openHAB REST API">Reload REST</button>
        <div class="token-row">
          <input id="api-token" type="password" autocomplete="off" spellcheck="false" placeholder="API token (oh.…)" title="openHAB API token. Stored in this browser only." />
          <button id="btn-token-save" type="button" title="Save token in this browser">Save</button>
        </div>
        <button id="btn-source-files" type="button" title="Parse live DSL via src/*.txt hard links">Nodes from Config files</button>
      </fieldset>
      <button id="btn-full-graph" type="button" hidden>Show full graph</button>
      <fieldset class="engine-group">
        <legend>visualization engine</legend>
        <button id="btn-vis" type="button">vis-network</button>
        <button id="btn-cy" type="button">cytoscape.js</button>
        <button id="btn-3d" class="active" type="button">3D</button>
      </fieldset>
      <input id="search" type="search" placeholder="Filter name…" style="min-width:180px" />
      <select id="fileFilter"><option value="">all files</option></select>
    </div>
    <div class="toolbar">
      <div class="checks">
        <label><input type="checkbox" data-kind="file" checked />
          <svg class="kind-icon" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="3" width="10" height="6" rx="1.5" fill="#8aa0b8"/></svg>
          files</label>
        <label><input type="checkbox" data-kind="group" checked />
          <svg class="kind-icon" viewBox="0 0 12 12" aria-hidden="true"><polygon points="6,1 11,6 6,11 1,6" fill="#f0c14b"/></svg>
          groups</label>
        <label><input type="checkbox" data-kind="item" checked />
          <svg class="kind-icon" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="#3d8bfd"/></svg>
          items</label>
        <label><input type="checkbox" data-kind="thing" checked />
          <svg class="kind-icon" viewBox="0 0 12 12" aria-hidden="true"><polygon points="6,1 11,3.5 11,8.5 6,11 1,8.5 1,3.5" fill="#2ecc71"/></svg>
          things</label>
        <label><input type="checkbox" data-kind="rule" checked />
          <svg class="kind-icon" viewBox="0 0 12 12" aria-hidden="true"><polygon points="6,1.5 11,10.5 1,10.5" fill="#e67e22"/></svg>
          rules</label>
        <label><input type="checkbox" data-kind="sitemap" checked />
          <svg class="kind-icon" viewBox="0 0 12 12" aria-hidden="true"><polygon points="6,1 7.4,4.6 11.2,4.8 8.2,7.2 9.2,11 6,9 2.8,11 3.8,7.2 0.8,4.8 4.6,4.6" fill="#9b59b6"/></svg>
          sitemaps</label>
        <label><input type="checkbox" data-kind="cron" checked />
          <svg class="kind-icon" viewBox="0 0 12 12" aria-hidden="true"><ellipse cx="6" cy="6" rx="5" ry="3.2" fill="#00cec9"/></svg>
          cron</label>
      </div>
      <span class="meta" id="meta"></span>
    </div>
    <details id="deviation" hidden>
      <summary>Source deviation (REST vs config files)</summary>
      <div id="deviation-body"></div>
    </details>
  </header>
  <div id="stage">
    <div id="build-progress" hidden>
      <div class="build-progress-track"><div id="build-progress-fill"></div></div>
      <span id="build-progress-label">0%</span>
    </div>
    <div id="graph-spin">
      <div id="graph"></div>
    </div>
    <div id="rotate-banner">Rotation on — left-click to stop</div>
    <aside id="detail">
      <button id="detail-close" type="button" aria-label="Close">×</button>
      <h2 id="detail-title"></h2>
      <dl id="detail-body"></dl>
    </aside>
    <div id="nav-sphere" title="Drag sphere to rotate in 3D · wheel to zoom · double-click to reset">
      <div class="ring"></div>
      <div class="globe" id="nav-globe"></div>
      <div class="knob" id="nav-knob"></div>
      <button class="zoom in" type="button" id="zoom-in" title="Zoom in">+</button>
      <button class="zoom out" type="button" id="zoom-out" title="Zoom out">−</button>
      <button class="zoom fit" type="button" id="zoom-fit" title="Fit">⌂</button>
    </div>
  <div id="hint">
    <div><span class="swatch" style="background:#8aa0b8"></span>file
      <span class="swatch" style="background:#f0c14b"></span>group
      <span class="swatch" style="background:#3d8bfd"></span>item
      <span class="swatch" style="background:#2ecc71"></span>thing
      <span class="swatch" style="background:#e67e22"></span>rule
      <span class="swatch" style="background:#9b59b6"></span>sitemap
      <span class="swatch" style="background:#00cec9"></span>cron</div>
    Drag the sphere to rotate in 3D. Wheel zooms. Use 3D for a spatial layout; vis-network and cytoscape tilt the 2D graph.
  </div>
  </div>
  <script src="parse.js"></script>
  <script src="app.js"></script>
</body>
</html>
